<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d2425" />
    <title>Mishi · La noche de las estrellas caídas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header class="masthead" aria-label="Opciones del juego">
        <span class="world-name">Lunaris</span>
        <div class="header-right">
          <button id="mute" class="icon-button" aria-label="Silenciar audio">
            Sonido activado
          </button>
          <button id="pause" class="icon-button" hidden>Pausar</button>
        </div>
      </header>
      <section class="game-shell" aria-label="Juego de Mishi">
        <div
          id="game"
          aria-label="Área de juego. Usa flechas o WASD para volar y espacio para disparar."
        ></div>
        <div id="hud" hidden>
          <div>
            <span id="level-label">Bosque Encantado</span
            ><span id="lives" aria-label="3 vidas">♥ ♥ ♥</span>
          </div>
          <div class="hud-score">
            <span>Puntos</span><strong id="score">0</strong>
          </div>
          <div class="hud-progress">
            <span id="wave-label">Capítulo 1 de 5</span>
            <div
              class="progress-track"
              role="progressbar"
              aria-label="Avance del capítulo"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <i id="progress"></i>
            </div>
          </div>
          <div id="powers"></div>
        </div>
        <div id="overlay" class="overlay"></div>
        <aside class="journey" aria-label="Progreso de los cinco capítulos">
          <ol id="chapters"></ol>
        </aside>
        <div id="touch" hidden>
          <div class="dpad">
            <button data-control="up" aria-label="Volar arriba">↑</button
            ><button data-control="left" aria-label="Volar izquierda">←</button
            ><button data-control="down" aria-label="Volar abajo">↓</button
            ><button data-control="right" aria-label="Volar derecha">→</button>
          </div>
          <button
            class="fire"
            data-control="fire"
            aria-label="Disparar hechizos"
          >
            ✦<span>Hechizo</span>
          </button>
        </div>
      </section>
      <section class="below">
        <p class="touch-help">
          Mantén las flechas para volar y Hechizo para disparar.
        </p>
        <p class="keyboard-help">
          <kbd>WASD</kbd> / <kbd>↑ ↓ ← →</kbd> Volar <span>·</span>
          <kbd>Espacio</kbd> Disparar <span>·</span> <kbd>P</kbd> Pausa
        </p>
        <span class="save-note">Progreso guardado automáticamente</span>
      </section>
    </main>
    <script src="vendor/phaser.min.js"></script>
    <script src="src/assets/character.js"></script>
    <script src="src/assets/art.js"></script>
    <script src="src/managers/StorageManager.js"></script>
    <script src="src/audio/AudioManager.js"></script>
    <script src="src/physics/rules.js"></script>
    <script src="src/objects/Player.js"></script>
    <script src="src/objects/Enemy.js"></script>
    <script src="src/ui/UI.js"></script>
    <script src="src/scenes/BootScene.js"></script>
    <script src="src/scenes/MenuScene.js"></script>
    <script src="src/scenes/PlayScene.js"></script>
    <script src="src/scenes/EndScene.js"></script>
    <script src="src/managers/ViewportManager.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
